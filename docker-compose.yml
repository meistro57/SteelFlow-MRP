services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: steelflow-app
    container_name: steelflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - steelflow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: nginx:alpine
    container_name: steelflow-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - steelflow
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: steelflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3306:3306"
    volumes:
      - steelflow-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steelflow

  redis:
    image: redis:alpine
    container_name: steelflow-redis
    restart: unless-stopped
    networks:
      - steelflow

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: steelflow-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
    volumes:
      - steelflow-meilisearch:/meili_data
    networks:
      - steelflow

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: steelflow-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - steelflow
    depends_on:
      - mysql

  vite:
    container_name: steelflow-vite
    image: node:20-alpine
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/certs:/etc/nginx/certs:ro
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - steelflow

networks:
  steelflow:
    driver: bridge

volumes:
  steelflow-db:
    driver: local
  steelflow-meilisearch:
    driver: local
